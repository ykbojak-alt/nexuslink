name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build release exe
        run: cargo build --release --locked

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Build MSI
        run: cargo wix --package nexuslink

      - name: Zip the standalone exe
        shell: pwsh
        run: |
          $v = ${env:GITHUB_REF_NAME} -replace '^v',''
          Compress-Archive -Path target\release\nexuslink.exe `
            -DestinationPath nexuslink-$v-windows-x86_64.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nexuslink-*-windows-x86_64.zip
            target\wix\*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/nexuslink \
            target/x86_64-apple-darwin/release/nexuslink \
            -output target/universal/nexuslink

      - name: Bundle .app + .dmg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/macos/bundle.sh target/universal/nexuslink "$VERSION"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/bundle/nexuslink-*-macos-universal.dmg
